<!doctype html>
<!-- Tuttie wallet (phone). For now: pending approvals; each decision is signed with the user key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>Tuttie Wallet</title>
<link rel="stylesheet" href="/shared/tuttie.css">
<style>
  /* Phone-first: one column, large touch targets, safe areas. */
  body { padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); font-size: 18px; line-height: 1.4; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin: 8px 4px 20px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 24px; padding: 20px; margin-bottom: 16px; }
  .payee { font-size: 18px; font-weight: 600; color: var(--muted); }
  .amount { font-size: 42px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 8px; }
  .summary { color: #cfcedb; font-size: 16px; margin-bottom: 14px; }
  .seals { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .buttons button { font-size: 19px; font-weight: 700; padding: 18px; border-radius: 18px; }
  .approve { background: #fff; color: #08080b; }
  .decline { background: var(--panel); color: var(--text); border: 1px solid var(--line2); }
  .empty, .done { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<h1>Approvals</h1>
<div id="list"><p class="empty">Nothing to approve.</p></div>
<p class="done" id="done"></p>
<script src="/shared/seals.js"></script>
<script>
  const list = document.getElementById("list");
  const done = document.getElementById("done");
  let shown = "";

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  async function decide(id, decision) {
    await fetch(`/approvals/${id}`, { method: "POST", headers: { "content-type": "application/json" },
                                      body: JSON.stringify({ decision }) });
    done.textContent = decision === "approved" ? "Approved and signed with your key." : "Declined.";
    refresh();
  }

  function render(approvals) {
    list.innerHTML = "";
    if (!approvals.length) list.append(el("p", "empty", "Nothing to approve."));
    approvals.forEach(a => {
      const card = el("div", "card");
      const seals = el("div", "seals");
      a.seals.filter(s => s.valid).forEach(s => seals.append(sealBadge(s)));
      const buttons = el("div", "buttons");
      const approve = el("button", "approve", "Approve");
      const decline = el("button", "decline", "Decline");
      approve.onclick = () => decide(a.id, "approved");
      decline.onclick = () => decide(a.id, "declined");
      buttons.append(approve, decline);
      card.append(el("div", "payee", a.payee_name), el("div", "amount", `CHF ${a.amount_chf}`),
                  el("div", "summary", a.summary), seals, buttons);
      list.append(card);
    });
  }

  async function refresh() {
    try {
      const approvals = await (await fetch("/approvals/pending")).json();
      const key = JSON.stringify(approvals.map(a => a.id));
      if (key !== shown) {  // re-render only on change, so taps are never lost
        shown = key;
        if (approvals.length) done.textContent = "";
        render(approvals);
      }
    } catch (error) { /* keep polling */ }
  }

  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
