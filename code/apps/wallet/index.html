<!doctype html>
<!-- Tuttie wallet: the phone app. The Tuttie card is the agent's face. Tapping the face wakes the
     agent into voice mode; text is a fallback (the eyes close while typing). Not connected yet. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black": iOS keeps its own status bar area, so the app starts below the Dynamic Island. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tuttie">
<link rel="manifest" href="/wallet/manifest.json">
<link rel="apple-touch-icon" href="/wallet/icons/apple-touch-icon.png">
<title>Tuttie</title>
<link rel="stylesheet" href="/shared/tuttie.css">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; background: #000; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* --app-h / --app-top follow the visible viewport (see fitViewport), so the on-screen
     keyboard shrinks the app instead of pushing it off screen. */
  .app { position: fixed; left: 0; right: 0; top: var(--app-top, 0px); height: var(--app-h, 100dvh);
         max-width: 430px; margin: 0 auto; overflow: hidden;
         --top: max(16px, env(safe-area-inset-top)); --bottom: max(16px, env(safe-area-inset-bottom));
         /* Everything below is derived from the safe areas and the screen width, so the stack
            fits any phone and never slides under the title or the status bar. */
         --head: 56px; --peek: clamp(50px, 15vw, 64px);
         --card-w: calc(min(100vw, 430px) - 32px); --card-h: calc(var(--card-w) / 1.586);
         --stack: calc(var(--top) + var(--head) + 12px);
         padding: var(--top) 16px var(--bottom); }

  /* Installed on the home screen: keep the whole app a bit further down from the status bar /
     Dynamic Island, whichever status bar style iOS applied. */
  @media (display-mode: standalone) { .app { --top: calc(env(safe-area-inset-top, 0px) + 28px); } }
  .standalone .app { --top: calc(env(safe-area-inset-top, 0px) + 28px); }

  .head { display: flex; justify-content: space-between; align-items: center; height: var(--head); padding: 0 4px;
          transition: opacity .4s var(--ease), transform .5s var(--ease); }
  .head h1 { margin: 0; font-size: clamp(28px, 8.5vw, 34px); font-weight: 700; letter-spacing: -.01em; }
  .app.open .head { opacity: 0; transform: translateY(-14px); pointer-events: none; }

  /* Card stack: earlier cards show only their top strip, the Tuttie card is in front. */
  .card { position: absolute; left: 16px; right: 16px; top: calc(var(--stack) + var(--i) * var(--peek)); height: var(--card-h);
          border-radius: calc(var(--card-w) * .045); overflow: hidden;
          box-shadow: 0 -1px 0 rgba(255, 255, 255, .12) inset, 0 -8px 24px rgba(0, 0, 0, .55);
          transition: top .7s var(--ease), height .7s var(--ease), transform .7s var(--ease), opacity .5s var(--ease), border-radius .7s var(--ease); }
  /* Only the bank cards get a GPU layer: a promoted agent card is rasterised at stack size on
     iOS and looks blurry after it expands. */
  .card:not(.agent) { will-change: transform; }
  .card[data-i="0"] { --i: 0; }
  .card[data-i="1"] { --i: 1; }
  .card:active:not(.agent) { transform: scale(.985); }
  .bank-a { background: linear-gradient(135deg, #3a63e8, #1b2f8f 60%, #111c55); }
  .bank-b { background: linear-gradient(135deg, #2e2e33, #0d0d0e 70%); }
  .chip svg { width: 100%; height: 100%; display: block; fill: none; stroke: rgba(90, 68, 28, .55); stroke-width: 1; }
  .chip { position: absolute; left: 20px; top: 20px; width: 40px; height: 30px; border-radius: 7px; overflow: hidden;
          background: linear-gradient(135deg, #e8d6a8, #b39a5e); opacity: .85; }

  /* The Tuttie card is nothing but the agent's face. */
  .agent { --i: 2; cursor: pointer; touch-action: none; background: #0c0c10;
           box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 -8px 24px rgba(0, 0, 0, .55); }
  /* The face keeps its 2:1 shape (like pycozmo's 128x64 screen) and is only moved and scaled
     with transforms, so opening the card never re-renders it at a new size mid-animation. */
  .agent canvas { position: absolute; left: 0; width: 100%; aspect-ratio: 2 / 1; top: 50%; display: block;
                  transform: translateY(-50%) scale(.92); transition: top .7s var(--ease), transform .7s var(--ease); }
  /* Listening: just a thin line that breathes gently, no glow. */
  .agent .edge { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease);
                 box-shadow: inset 0 0 0 1px rgba(255, 181, 150, .45); }
  .app.voice .agent .edge { opacity: 1; animation: listen 3s ease-in-out infinite; }
  @keyframes listen { 50% { opacity: .45; } }

  /* Open: the other cards drop away and the face fills the screen. */
  .app.open .card:not(.agent) { transform: translateY(110vh); opacity: 0; }
  .app.open .agent { top: var(--top); height: calc(var(--app-h, 100dvh) - var(--top) - var(--bottom)); border-radius: 32px; }
  .app.typing { --bottom: 8px; }
  .app.open .agent canvas { top: 42%; transform: translateY(-50%) scale(1); }
  .app.typing .agent canvas { top: 30%; transform: translateY(-50%) scale(.8); }
  @media (prefers-reduced-motion: reduce) { .card, .agent canvas, .head, .controls { transition-duration: .01s !important; } }

  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 64px 24px;  /* sides leave room for the keyboard icon */ display: flex; flex-direction: column; gap: 14px; align-items: center;
              opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .4s var(--ease) .25s, transform .5s var(--ease) .25s; }
  .app.open .controls { opacity: 1; transform: none; pointer-events: auto; }
  .status { font-size: 15px; font-weight: 500; color: var(--muted); text-align: center; min-height: 20px; }
  .said { font-size: 20px; font-weight: 600; text-align: center; line-height: 1.3; min-height: 26px; color: var(--text); }
  .pill { background: #1c1c1f; color: var(--text); font-size: 14px; padding: 8px 16px; border-radius: 20px; }
  /* Grab bar: the open card closes by swiping down, like an iOS sheet. */
  .grabber { position: absolute; top: 10px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px;
             background: rgba(255, 255, 255, .28); opacity: 0; transition: opacity .3s; z-index: 2; pointer-events: none; }
  .app.open .grabber { opacity: 1; }
  .agent.dragging { transition: none; }
  /* The only text on the card: a quiet name label, in the stack and in the open view. */
  .label { position: absolute; top: 16px; left: 20px; z-index: 2; pointer-events: none;
           font-size: 13px; font-weight: 600; letter-spacing: .02em; color: rgba(236, 235, 244, .38); }
  .app.open .label { top: 22px; left: 24px; }
  form { display: none; width: 100%; gap: 8px; }
  .app.typing form { display: flex; }
  .app.typing .controls { padding: 0 20px 22px; }
  .app.typing #keyboard { display: none; }
  /* Text is a deliberate choice: a small, dim keyboard icon in the corner, never the default. */
  .kbd { position: absolute; right: 18px; bottom: 18px; width: 40px; height: 40px; padding: 8px; border-radius: 50%;
         background: transparent; color: var(--dim); }
  .kbd:active { color: var(--muted); background: #1c1c1f; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--panel2); border: 1px solid var(--line2);
          border-radius: 22px; padding: 11px 16px; }
  input:focus { outline: none; border-color: var(--accent); }
  form button { border-radius: 22px; padding: 0 16px; font-size: 15px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head"><h1>Wallet</h1></div>

  <div class="card bank-a" data-i="0"><span class="chip"><svg viewBox="0 0 40 30"><path d="M0 10h13M0 20h13M27 10h13M27 20h13M13 0v30M27 0v30M13 15h14"/></svg></span></div>
  <div class="card bank-b" data-i="1"><span class="chip"><svg viewBox="0 0 40 30"><path d="M0 10h13M0 20h13M27 10h13M27 20h13M13 0v30M27 0v30M13 15h14"/></svg></span></div>
  <div class="card agent" id="agent" aria-label="Tuttie, tap to talk">
    <canvas id="eyes"></canvas>
    <div class="edge"></div>
    <div class="grabber"></div>
    <span class="label">Tuttie</span>
    <div class="controls" id="controls">
      <div class="said" id="said"></div>
      <div class="status" id="status">Tap Tuttie to talk</div>
      <button class="kbd" id="keyboard" type="button" aria-label="Type instead">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7.5 14h9"/></svg>
      </button>
      <form id="form" autocomplete="off">
        <input id="text" placeholder="Message Tuttie…" enterkeyhint="send">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</div>
<script src="/shared/face.js"></script>
<script>
  // UI only for now: voice and text are not connected to the agent backend yet.
  // States: asleep (eyes closed) → tap the face → voice mode (eyes open, stays on until swiped down or
  // Type instead). Typing closes the eyes; tapping the face goes back to voice.
  const app = document.getElementById("app");
  const agent = document.getElementById("agent");
  const status = document.getElementById("status");
  const said = document.getElementById("said");
  const input = document.getElementById("text");
  const face = new TuttieFace(document.getElementById("eyes"));
  if (navigator.standalone) document.documentElement.classList.add("standalone");  // iOS home screen app

  // Size the app to the visible viewport and keep the page pinned (keyboard-safe on phones).
  function fitViewport() {
    const vv = window.visualViewport;
    document.documentElement.style.setProperty("--app-h", `${vv ? vv.height : innerHeight}px`);
    document.documentElement.style.setProperty("--app-top", `${vv ? vv.offsetTop : 0}px`);
    window.scrollTo(0, 0);
  }
  fitViewport();
  window.visualViewport?.addEventListener("resize", fitViewport);
  window.visualViewport?.addEventListener("scroll", fitViewport);
  window.addEventListener("resize", fitViewport);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/wallet/sw.js").catch(() => {});
  face.sleep(0);

  let openedAt = 0;  // taps on the controls right after opening are ignored (no accidental keyboard)

  function startVoice() {
    if (!app.classList.contains("open")) openedAt = performance.now();
    app.classList.add("open", "voice");
    app.classList.remove("typing");
    input.blur();
    face.wake("happiness");
    setTimeout(() => app.classList.contains("voice") && face.set("neutral", 700), 1300);
    status.textContent = "Listening…";
  }

  function startTyping() {
    app.classList.remove("voice");
    app.classList.add("typing");
    face.sleep();
    status.textContent = "Tap Tuttie to talk instead";
    input.focus({ preventScroll: true });
  }

  function close() {
    app.classList.remove("open", "voice", "typing");
    input.blur();
    said.textContent = "";
    status.textContent = "Tap Tuttie to talk";
    face.sleep();
  }

  // Gestures on the card, iOS-sheet style. The card follows the finger every frame; on release
  // the decision uses the speed of the last ~100 ms (so an uneven swipe or a flick back is read
  // right), and the closing or spring-back animation starts from where the finger left the card
  // with a duration matched to its speed. Closed: tap or swipe up wakes Tuttie into voice mode.
  // Open: swipe down closes. Taps while voice is on keep it on: Tuttie is never sent away by accident.
  const TAP = 8;          // px a finger may move and still count as a tap
  const SAMPLE_MS = 100;  // window for the release speed
  let drag = null;        // {startY, samples: [{y, t}], offset, frame}

  // Rubber band: past the natural direction the card moves less and less.
  const rubber = (d, k = 4) => Math.sign(d) * Math.sqrt(Math.abs(d)) * k;

  function offsetFor(dy) {
    if (app.classList.contains("open")) return dy > 0 ? dy : rubber(dy);  // down follows 1:1
    return dy < 0 ? Math.max(rubber(dy, 6), -90) : rubber(dy, 2);          // closed: up with resistance
  }

  function paint() {
    drag.frame = null;
    agent.style.transform = `translateY(${drag.offset}px)`;  // the card keeps its shape, it only moves
  }

  agent.addEventListener("pointerdown", e => {
    if (e.target.closest("button, form") || drag) return;
    try { agent.setPointerCapture(e.pointerId); } catch { /* keep following even off the card when possible */ }
    drag = { startY: e.clientY, samples: [{ y: e.clientY, t: performance.now() }], offset: 0, frame: null };
  });

  agent.addEventListener("pointermove", e => {
    if (!drag) return;
    const now = performance.now();
    drag.samples.push({ y: e.clientY, t: now });
    while (drag.samples.length > 2 && now - drag.samples[0].t > SAMPLE_MS) drag.samples.shift();
    const dy = e.clientY - drag.startY;
    if (Math.abs(dy) < TAP && !agent.classList.contains("dragging")) return;
    agent.classList.add("dragging");
    drag.offset = offsetFor(dy);
    if (!drag.frame) drag.frame = requestAnimationFrame(paint);
  });

  // Let the next transition run at `ms` (matched to the release speed), then restore the CSS default.
  function settleIn(ms) {
    agent.style.transitionDuration = `${ms}ms`;
    setTimeout(() => agent.style.removeProperty("transition-duration"), ms + 50);
  }

  function endDrag(e) {
    if (!drag) return;
    if (drag.frame) cancelAnimationFrame(drag.frame);
    const first = drag.samples[0], moved = e.clientY - drag.startY;
    const speed = (e.clientY - first.y) / Math.max(16, performance.now() - first.t);  // px per ms, + = down
    const dragged = agent.classList.contains("dragging"), open = app.classList.contains("open");
    drag = null;

    let action = null;
    if (!dragged || Math.abs(moved) < TAP) action = "tap";
    else if (open && speed > -.2 && (moved > 120 || (moved > 30 && speed > .35))) action = "close";
    else if (!open && speed < .2 && (moved < -30 || speed < -.35)) action = "open";

    // Duration from the remaining distance and the finger's speed: fast flicks finish fast.
    const remaining = action === "close" ? Math.max(200, innerHeight - moved) : Math.abs(moved) + 60;
    if (action !== "tap") settleIn(Math.round(Math.min(650, Math.max(240, remaining / Math.max(Math.abs(speed), .8)))));
    agent.classList.remove("dragging");
    agent.style.removeProperty("transform");  // transitions back from the dragged position, no jump

    if (action === "close") close();
    else if (action === "open") startVoice();
    else if (action === "tap") {
      if (!open || !app.classList.contains("voice")) startVoice();
      else face.set("excitement", 250), setTimeout(() => face.set("neutral", 500), 600);
    }
  }
  agent.addEventListener("pointerup", endDrag);
  agent.addEventListener("pointercancel", endDrag);
  document.getElementById("keyboard").addEventListener("click", () => {
    if (performance.now() - openedAt > 700) startTyping();
  });
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    said.textContent = `“${text}”`;
    status.textContent = "Not connected to the agent web yet";
  });
</script>
</body>
</html>
