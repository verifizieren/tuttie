<!doctype html>
<!-- Tuttie wallet: the phone app. A wallet card stack; the Tuttie card expands into the agent
     (big eyes, voice first, text as a fallback). Not connected to the agent backend yet. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tuttie</title>
<link rel="stylesheet" href="/shared/tuttie.css">
<style>
  html, body { height: 100%; }
  body { background: #000; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  .app { position: relative; max-width: 430px; height: 100dvh; margin: 0 auto; overflow: hidden;
         padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }

  .head { display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 4px;
          transition: opacity .4s var(--ease), transform .5s var(--ease); }
  .head h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
  .round { width: 34px; height: 34px; border-radius: 50%; background: #1c1c1f; display: grid; place-items: center; font-size: 20px; color: var(--text); }
  .app.open .head { opacity: 0; transform: translateY(-14px); pointer-events: none; }

  /* Card stack: earlier cards show only their top strip, the Tuttie card is in front. */
  .card { position: absolute; left: 16px; right: 16px; height: 210px; border-radius: 18px; overflow: hidden;
          box-shadow: 0 -1px 0 rgba(255, 255, 255, .12) inset, 0 -8px 24px rgba(0, 0, 0, .55);
          transition: top .7s var(--ease), height .6s var(--ease), transform .7s var(--ease), opacity .5s var(--ease); }
  .card[data-i="0"] { top: 84px; }
  .card[data-i="1"] { top: 148px; }
  .card.agent { top: 212px; cursor: pointer; touch-action: none; }
  .bank-a { background: linear-gradient(135deg, #3a63e8, #1b2f8f 60%, #111c55); }
  .bank-b { background: linear-gradient(135deg, #2e2e33, #0d0d0e 70%); }
  .chip { position: absolute; left: 20px; top: 20px; width: 40px; height: 30px; border-radius: 7px;
          background: linear-gradient(135deg, #e8d6a8, #b39a5e); opacity: .85; }
  .agent { background: linear-gradient(140deg, #e69373 0%, #c4623f 55%, #8f3f27 100%); }
  .agent::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                  background: radial-gradient(90% 70% at 100% 0%, rgba(255, 255, 255, .18), transparent 60%); }
  .agent .name { position: absolute; top: 18px; left: 20px; font-size: 21px; font-weight: 700; color: #fff7f0; transition: opacity .3s; }
  .agent .hint { position: absolute; bottom: 18px; right: 20px; font-size: 13px; font-weight: 600; color: rgba(255, 247, 240, .75); transition: opacity .3s; }

  /* The eyes live in a dark screen inside the card; it grows when the agent opens. */
  .screen { position: absolute; left: 20px; bottom: 18px; width: 120px; height: 64px; border-radius: 14px; background: #08080b;
            transition: all .65s var(--ease); z-index: 1; }
  .screen canvas { width: 100%; height: 100%; display: block; }

  /* Open: the other cards drop away, the Tuttie card fills the screen and becomes the agent. */
  .app.open .card:not(.agent) { transform: translateY(110vh); opacity: 0; }
  .app.open .agent { top: max(16px, env(safe-area-inset-top)); height: calc(100dvh - 2 * max(16px, env(safe-area-inset-top))); cursor: default;
                     background: #08080b; box-shadow: 0 0 0 1px var(--line); }
  .app.open .agent::after, .app.open .agent .name, .app.open .agent .hint { opacity: 0; }
  .app.open .screen { left: 0; right: 0; bottom: auto; top: 70px; width: 100%; height: 38%; border-radius: 0; }

  .talk { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 22px; display: flex; flex-direction: column; gap: 14px;
          opacity: 0; transform: translateY(20px); pointer-events: none; transition: opacity .4s var(--ease) .25s, transform .5s var(--ease) .25s; }
  .app.open .talk { opacity: 1; transform: none; pointer-events: auto; }
  .close { position: absolute; top: 18px; right: 18px; z-index: 2; opacity: 0; pointer-events: none; transition: opacity .3s; background: #1c1c1f; font-size: 14px; padding: 7px 14px; border-radius: 20px; }
  .app.open .close { opacity: 1; pointer-events: auto; }
  .said { min-height: 84px; text-align: center; font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
  .said small { display: block; margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .mic { align-self: center; width: 84px; height: 84px; border-radius: 50%; padding: 0; display: grid; place-items: center;
         background: radial-gradient(circle at 35% 30%, #ffd1bb, #d97757 60%, #9c4429); box-shadow: 0 0 40px rgba(217, 119, 87, .45); }
  .mic svg { width: 32px; height: 32px; }
  .mic.on { animation: listen 1.3s ease-in-out infinite; }
  @keyframes listen { 50% { transform: scale(1.08); box-shadow: 0 0 70px rgba(217, 119, 87, .8); } }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--panel2); border: 1px solid var(--line2);
          border-radius: 22px; padding: 11px 16px; }
  input:focus { outline: none; border-color: var(--accent); }
  form button { border-radius: 22px; padding: 0 16px; font-size: 15px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head"><h1>Wallet</h1><span class="round">+</span></div>

  <div class="card bank-a" data-i="0"><span class="chip"></span></div>
  <div class="card bank-b" data-i="1"><span class="chip"></span></div>
  <div class="card agent" id="agent">
    <span class="name">Tuttie</span>
    <span class="hint">Tap to talk</span>
    <div class="screen" id="screen"><canvas id="eyes"></canvas></div>
    <button class="close" id="close" type="button">Done</button>
    <div class="talk">
      <div class="said" id="said">Hi, I'm Tuttie.<small>Tap the mic and tell me what you need.</small></div>
      <button class="mic" id="mic" type="button" aria-label="Talk to Tuttie">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a.9.9 0 1 0-1.8 0 4.2 4.2 0 0 1-8.4 0 .9.9 0 1 0-1.8 0 6 6 0 0 0 5.1 5.9V20H9a.9.9 0 1 0 0 1.8h6a.9.9 0 1 0 0-1.8h-2.1v-2.6a6 6 0 0 0 5.1-5.9z"/></svg>
      </button>
      <form id="form" autocomplete="off">
        <input id="text" placeholder="Type instead…" enterkeyhint="send">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</div>
<script src="/shared/face.js"></script>
<script>
  // UI only for now: the agent is not connected to the backend yet; the eyes react locally.
  const app = document.getElementById("app");
  const agent = document.getElementById("agent");
  const said = document.getElementById("said");
  const mic = document.getElementById("mic");
  const face = new TuttieFace(document.getElementById("eyes"));

  function say(text, note = "") {
    said.textContent = text;
    if (note) { const small = document.createElement("small"); small.textContent = note; said.append(small); }
  }

  function open() {
    if (app.classList.contains("open")) return;
    app.classList.add("open");
    face.set("happiness");
    setTimeout(() => face.set("neutral", 700), 1400);
  }

  function close() {
    app.classList.remove("open");
    mic.classList.remove("on");
    face.set("neutral");
  }

  // Tap or swipe up on the Tuttie card opens the agent.
  let startY = null;
  agent.addEventListener("pointerdown", e => { startY = e.clientY; });
  agent.addEventListener("pointerup", e => {
    if (startY === null || app.classList.contains("open")) return;
    if (startY - e.clientY > 30 || Math.abs(startY - e.clientY) < 8) open();
    startY = null;
  });
  document.getElementById("close").addEventListener("click", e => { e.stopPropagation(); close(); });

  mic.addEventListener("click", () => {
    const listening = mic.classList.toggle("on");
    face.set(listening ? "amazement" : "neutral");
    say(listening ? "Listening…" : "Hi, I'm Tuttie.", listening ? "Voice is not connected yet." : "Tap the mic and tell me what you need.");
  });

  const input = document.getElementById("text");
  input.addEventListener("focus", () => face.lookAt(0, .8));
  input.addEventListener("blur", () => face.lookAt(0, 0));
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    face.set("excitement");
    say(`“${text}”`, "Got it. I'm not connected to the agent web yet.");
    setTimeout(() => face.set("neutral", 700), 1600);
  });

  // Tap the big eyes to try the expressions ported from pycozmo.
  let expression = 0;
  document.getElementById("screen").addEventListener("click", () => {
    if (!app.classList.contains("open")) return;
    expression = (expression + 1) % TuttieFace.EXPRESSIONS.length;
    face.set(TuttieFace.EXPRESSIONS[expression]);
  });
</script>
</body>
</html>
