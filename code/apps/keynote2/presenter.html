<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuttie · presenter</title>
  <style>
    @font-face { font-family: "Inter"; src: url("fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
    :root { --bg: #f2f2f7; --ink: #17171d; --ink-2: #5a5967; --ink-3: #a3a2ad; --accent: #2f6fe0; --red: #d93b3b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); }
    body {
      color: var(--ink); font-family: "Inter", system-ui, sans-serif; font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto 1fr auto;
      padding: 32px 48px 32px; gap: 32px;
    }
    header { display: flex; align-items: baseline; gap: 32px; font-feature-settings: "tnum"; }
    #where { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    #where span { color: var(--ink-2); font-weight: 450; margin-left: 12px; }
    #flags { color: var(--red); font-size: 16px; font-weight: 600; letter-spacing: .04em; }
    .timers { margin-left: auto; display: flex; gap: 40px; align-items: baseline; }
    .timers div { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .timers small { font-size: 13px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
    .timers b { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
    #delta.late { color: var(--red); }
    #delta.early { color: var(--accent); }
    main { display: flex; flex-direction: column; gap: 40px; min-height: 0; }
    .label { font-size: 13px; color: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; }
    .cue { font-size: 20px; color: var(--accent); margin-bottom: 16px; line-height: 1.35; }
    #now { font-size: 44px; font-weight: 550; line-height: 1.22; letter-spacing: -0.02em; max-width: 30em; }
    #next { font-size: 28px; font-weight: 450; line-height: 1.3; color: var(--ink-2); max-width: 36em; }
    #nextcue { color: var(--ink-3); }
    footer { display: flex; gap: 4px; font-size: 13px; font-feature-settings: "tnum"; }
    footer div { flex: 1; border-top: 3px solid var(--ink-3); padding-top: 10px; color: var(--ink-2); }
    footer div.done { border-color: var(--ink-2); }
    footer div.current { border-color: var(--accent); color: var(--ink); }
    footer strong { display: block; font-weight: 600; margin-bottom: 4px; }
    .keys { font-size: 13px; color: var(--ink-3); }
  </style>
</head>
<body>
  <header>
    <p id="where">–</p>
    <p id="flags"></p>
    <div class="timers">
      <div><small>Beat</small><b id="beat">0:00</b></div>
      <div><small>vs plan</small><b id="delta">0:00</b></div>
      <div><small>Elapsed</small><b id="elapsed">0:00</b></div>
      <div><small>Clock</small><b id="clock">00:00</b></div>
    </div>
  </header>
  <main>
    <section>
      <p class="label">Now</p>
      <p class="cue" id="cue"></p>
      <p id="now"></p>
    </section>
    <section>
      <p class="label">Next click</p>
      <p class="cue" id="nextcue"></p>
      <p id="next"></p>
    </section>
  </main>
  <footer id="plan"></footer>
  <script type="module" src="presenter.js"></script>
</body>
</html>
