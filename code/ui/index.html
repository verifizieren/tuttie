<!doctype html>
<!-- Demo UI: chat with the assistant (left) and the signed "behind the scenes" timeline (right). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Webs</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --ink: #14171f; --muted: #5d6573; --line: #dde1e7;
    --gold: #b8860b; --gold-bg: #fff4d6; --blue: #1f5fd1; --blue-bg: #e3edff;
    --grey: #6b7280; --grey-bg: #eceef1; --red: #c62828; --red-bg: #fde7e7; --green: #1b7f3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--ink); color: #fff; }
  header h1 { margin: 0; font-size: 24px; }
  header span { color: #b9c0cc; }
  header #phone { margin-left: auto; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; height: calc(100vh - 64px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  section h2 { margin: 0; padding: 14px 18px; font-size: 18px; border-bottom: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .scroll { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .msg { max-width: 88%; padding: 12px 16px; border-radius: 14px; margin-bottom: 12px; white-space: pre-wrap; }
  .user { margin-left: auto; background: var(--ink); color: #fff; }
  .bot { background: var(--bg); }
  .waiting { color: var(--muted); font-style: italic; }
  /* Thinking box: a fixed-height, scrollable, collapsible window inside the chat. */
  details.thoughts { max-width: 88%; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; color: var(--muted); }
  details.thoughts summary { cursor: pointer; padding: 8px 14px; font-weight: 600; }
  details.thoughts[open] summary { border-bottom: 1px solid var(--line); }
  .thought-list { max-height: 180px; overflow-y: auto; padding: 8px 14px; }
  .thought { margin-bottom: 8px; white-space: pre-wrap; }
  .thought b { color: var(--ink); }
  .composer { border-top: 1px solid var(--line); padding: 10px 18px 14px; }
  .prompts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .prompts button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-size: 15px; font-weight: 500; padding: 6px 12px; border-radius: 999px; }
  form { display: flex; gap: 10px; }
  textarea { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; resize: none; height: 72px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  header button { background: #2b3140; }
  .step { border: 1px solid var(--line); border-left: 6px solid var(--green); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; animation: in .25s ease-out; }
  .step.broken { border-left-color: var(--red); background: var(--red-bg); }
  .step.pending { border-left-color: var(--gold); background: var(--gold-bg); }
  .step.declined { border-left-color: var(--red); }
  .step .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kind { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 92px; }
  .node { font-weight: 700; }
  .status { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--green); }
  .broken .status { color: var(--red); }
  .summary { margin-top: 4px; }
  .broken .summary { text-decoration: line-through; color: var(--red); }
  .seal { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 2px 9px 2px 3px; border-radius: 999px; border: 2px solid; }
  .seal svg { width: 18px; height: 18px; flex: none; }
  .seal.invalid svg { filter: grayscale(1); opacity: .6; }
  .seal.gold { color: var(--gold); background: var(--gold-bg); }
  .seal.blue { color: var(--blue); background: var(--blue-bg); }
  .seal.grey { color: var(--grey); background: var(--grey-bg); }
  .seal.invalid { color: var(--red); background: var(--red-bg); text-decoration: line-through; }
  .empty { color: var(--muted); }
  .cite { font-size: 13px; font-weight: 700; padding: 0 6px; border-radius: 6px; border: 1px solid; vertical-align: 2px; }
  .cite.gold { color: var(--gold); background: var(--gold-bg); }
  .cite.blue { color: var(--blue); background: var(--blue-bg); }
  .cite.grey { color: var(--grey); background: var(--grey-bg); }
  #qr { position: fixed; inset: 0; background: rgba(20, 23, 31, .85); display: none; place-items: center; }
  #qr.open { display: grid; }
  #qr div { background: #fff; padding: 24px; border-radius: 16px; text-align: center; }
  #qr img { width: min(70vh, 80vw); display: block; }
  #qr a { font-size: 20px; font-weight: 600; color: var(--blue); word-break: break-all; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } section { height: 70vh; } }
</style>
</head>
<body>
<header>
  <h1>Two Webs</h1><span>your assistant on the agent web</span>
  <button id="phone" type="button">Phone</button>
  <button id="reset" type="button">New demo</button>
</header>
<main>
  <section>
    <h2>Chat</h2>
    <div class="scroll" id="chat"></div>
    <div class="composer">
      <div class="prompts" id="prompts"></div>
      <form id="form">
        <textarea id="input" placeholder="Ask your assistant…"></textarea>
        <button id="send">Send</button>
      </form>
    </div>
  </section>
  <section>
    <h2>Behind the scenes</h2>
    <div class="scroll" id="timeline"><p class="empty">Signed steps will appear here.</p></div>
  </section>
</main>
<div id="qr" title="Click to close"><div><img src="/phone-qr.svg" alt="QR code of the phone page"><p>Scan to approve on your phone</p><a id="phone-link" href="/phone.html" target="_blank"></a></div></div>
<script src="/seals.js"></script>
<script>
  // Demo prompts shown as buttons above the text field; a click sends the prompt.
  const PROMPTS = [
    ["Dog + 1am arrival", "Book me a quiet, dog-friendly hotel near Basel SBB under CHF 200 for 14 Nov, I arrive around 1am."],
    ["Family room", "Book a family room near Basel SBB for 2 adults and a 3-year-old on 14 Nov. We need a bed for our child."],
    ["Cheapest hotel", "What is the cheapest hotel near Basel SBB for 14 Nov? Just compare prices, don't book."],
    ["Dog at Spalenhof?", "Can I bring my dog to Hotel Spalenhof on 14 Nov?"],
  ];
  const KIND_LABELS = { registry: "Registry", a2t: "A2T", a2a: "A2A", marketplace: "Marketplace",
                        payment: "Payment", approval: "Approval", answer: "Answer" };
  const TIER_RANK = { grey: 1, blue: 2, gold: 3 };
  const chat = document.getElementById("chat");
  const timeline = document.getElementById("timeline");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const stepTier = {};  // timeline step -> best valid seal tier, for citations in answers
  let turn = null;      // the running assistant turn: {thoughts, list, count, waiting}

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function scrollDown(box) { box.scrollTop = box.scrollHeight; }

  function addMessage(role, text) {
    const msg = el("div", "msg " + role, text);
    chat.appendChild(msg);
    scrollDown(chat);
    return msg;
  }

  // Start an assistant turn: a waiting bubble; the thinking box appears with the first thought.
  function startTurn() {
    turn = { thoughts: null, count: 0, waiting: addMessage("bot waiting", "Thinking…") };
  }

  // A collapsible, fixed-height thinking window placed just above the waiting bubble.
  function thinkingBox() {
    const thoughts = el("details", "thoughts");
    thoughts.open = true;
    turn.label = el("summary", null, "Thinking…");
    turn.list = el("div", "thought-list");
    thoughts.append(turn.label, turn.list);
    chat.insertBefore(thoughts, turn.waiting);
    turn.thoughts = thoughts;
  }

  // Reasoning summaries look like "**Title**\n\nbody".
  function addThought(text) {
    if (!turn) startTurn();
    if (!turn.thoughts) thinkingBox();
    const [, title, body] = text.match(/^\*\*(.+?)\*\*\s*([\s\S]*)$/) || [null, null, text];
    const item = el("div", "thought");
    if (title) item.append(el("b", null, title), "\n");
    item.append(body);
    turn.list.appendChild(item);
    turn.count += 1;
    turn.label.textContent = `Thinking… ${title || ""}`;
    scrollDown(turn.list);
    scrollDown(chat);
  }

  // Render answer text: "**bold**" as bold and "[3]" as a seal badge for timeline step 3.
  function renderAnswer(target, text) {
    target.textContent = "";
    text.split(/(\[\d+\]|\*\*[^*]+\*\*)/).forEach(part => {
      const cite = part.match(/^\[(\d+)\]$/);
      const bold = part.match(/^\*\*([^*]+)\*\*$/);
      if (cite && stepTier[cite[1]]) target.append(el("span", "cite " + stepTier[cite[1]], `#${cite[1]}`));
      else if (bold) target.append(el("b", null, bold[1]));
      else target.append(part);
    });
  }

  function showAnswer(event) {
    const msg = turn ? turn.waiting : addMessage("bot", "");
    msg.className = "msg bot";
    renderAnswer(msg, event.summary);
    if (turn && turn.thoughts) {
      turn.label.textContent = `Thought process (${turn.count} steps)`;
      turn.thoughts.open = false;
    }
    turn = null;
    send.disabled = false;
    scrollDown(chat);
  }

  function addStep(event) {
    const valid = event.seals.filter(s => s.valid).map(s => s.tier);
    if (valid.length) stepTier[event.step] = valid.sort((a, b) => TIER_RANK[b] - TIER_RANK[a])[0];
    if (event.kind === "answer") return showAnswer(event);
    if (event.kind === "thinking") return addThought(event.summary);
    timeline.querySelector(".empty")?.remove();
    const step = el("div", "step " + event.status);
    const top = el("div", "top");
    top.append(el("span", "kind", KIND_LABELS[event.kind] || event.kind));
    if (event.node_name) top.append(el("span", "node", event.node_name));
    event.seals.forEach(seal => top.append(sealBadge(seal)));
    top.append(el("span", "status", event.status));
    step.append(top, el("div", "summary", event.summary));
    timeline.appendChild(step);
    scrollDown(timeline);
  }

  function clearAll() {
    turn = null;
    send.disabled = false;
    chat.innerHTML = "";
    timeline.innerHTML = '<p class="empty">Signed steps will appear here.</p>';
  }

  async function sendMessage(text) {
    if (!text || send.disabled) return;
    addMessage("user", text);
    input.value = "";
    send.disabled = true;
    startTurn();
    try {
      await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" },
                             body: JSON.stringify({ message: text }) });
    } catch (error) {
      turn.waiting.textContent = "The assistant is unreachable.";
      turn = null;
      send.disabled = false;
    }
  }

  const events = new EventSource("/events");
  events.addEventListener("message", e => addStep(JSON.parse(e.data)));
  events.addEventListener("reset", clearAll);

  const prompts = document.getElementById("prompts");
  PROMPTS.forEach(([label, text]) => {
    const button = el("button", null, label);
    button.type = "button";
    button.title = text;
    button.addEventListener("click", () => sendMessage(text));
    prompts.appendChild(button);
  });

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    sendMessage(input.value.trim());
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send.click(); }
  });
  const qr = document.getElementById("qr");
  const phoneLink = document.getElementById("phone-link");
  phoneLink.textContent = location.origin + "/phone.html";
  phoneLink.addEventListener("click", e => e.stopPropagation());  // open the link, keep the QR open
  document.getElementById("phone").addEventListener("click", () => qr.classList.add("open"));
  qr.addEventListener("click", () => qr.classList.remove("open"));
  document.getElementById("reset").addEventListener("click", () => fetch("/reset", { method: "POST" }));
</script>
</body>
</html>
