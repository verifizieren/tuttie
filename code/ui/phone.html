<!doctype html>
<!-- Phone approval page: lists pending approvals; the decision is signed with the user's key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<style>
  :root { --ink: #14171f; --muted: #5d6573; --line: #dde1e7; --gold: #b8860b; --gold-bg: #fff4d6;
          --blue: #1f5fd1; --blue-bg: #e3edff; --grey: #6b7280; --grey-bg: #eceef1; --red: #c62828; --green: #1b7f3b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 18px/1.4 system-ui, -apple-system, sans-serif; background: #f4f5f7; color: var(--ink); }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .payee { font-size: 20px; font-weight: 700; }
  .amount { font-size: 40px; font-weight: 800; margin: 6px 0; }
  .summary { color: var(--muted); margin-bottom: 10px; }
  .seals { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .seal { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 2px solid; }
  .seal.gold { color: var(--gold); background: var(--gold-bg); }
  .seal.blue { color: var(--blue); background: var(--blue-bg); }
  .seal.grey { color: var(--grey); background: var(--grey-bg); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; font-size: 20px; font-weight: 700; padding: 18px; border: 0; border-radius: 12px; color: #fff; }
  .approve { background: var(--green); }
  .decline { background: var(--red); }
  .empty, .done { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<h1>Approvals</h1>
<div id="list"><p class="empty">Nothing to approve.</p></div>
<p class="done" id="done"></p>
<script>
  const list = document.getElementById("list");
  const done = document.getElementById("done");
  let shown = "";

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  async function decide(id, decision) {
    await fetch(`/approvals/${id}`, { method: "POST", headers: { "content-type": "application/json" },
                                      body: JSON.stringify({ decision }) });
    done.textContent = decision === "approved" ? "Approved and signed with your key." : "Declined.";
    refresh();
  }

  function render(approvals) {
    list.innerHTML = "";
    if (!approvals.length) list.append(el("p", "empty", "Nothing to approve."));
    approvals.forEach(a => {
      const card = el("div", "card");
      const seals = el("div", "seals");
      a.seals.filter(s => s.valid).forEach(s => seals.append(el("span", "seal " + s.tier, `${s.tier} · ${s.issuer}`)));
      const buttons = el("div", "buttons");
      const approve = el("button", "approve", "Approve");
      const decline = el("button", "decline", "Decline");
      approve.onclick = () => decide(a.id, "approved");
      decline.onclick = () => decide(a.id, "declined");
      buttons.append(approve, decline);
      card.append(el("div", "payee", a.payee_name), el("div", "amount", `CHF ${a.amount_chf}`),
                  el("div", "summary", a.summary), seals, buttons);
      list.append(card);
    });
  }

  async function refresh() {
    try {
      const approvals = await (await fetch("/approvals/pending")).json();
      const key = JSON.stringify(approvals.map(a => a.id));
      if (key !== shown) {  // re-render only on change, so taps are never lost
        shown = key;
        if (approvals.length) done.textContent = "";
        render(approvals);
      }
    } catch (error) { /* keep polling */ }
  }

  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
