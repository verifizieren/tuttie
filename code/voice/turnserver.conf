# TURN relay for Tuttie's voice (coturn), started by scripts/run_all.py when TURN_SECRET is set.
# Phones can't reach LiveKit's media ports directly: the team server lets no UDP in, and iPhones
# don't use LiveKit's plain TCP port. They reach this relay on plain TCP 4044 instead (inside the
# server's open range); it passes their audio to LiveKit on this same host. The audio stays
# encrypted end to end by WebRTC (DTLS-SRTP), so the relay itself needs no TLS certificate.
# LiveKit hands the relay and its credentials to every client (rtc.turn_servers).
# From the command line (scripts/run_all.py): the user (--user tuttie:$TURN_SECRET) and the
# only peer it relays to, LiveKit on this server (--allowed-peer-ip $LIVEKIT_NODE_IP).
listening-port=4044
no-udp
no-tls
no-dtls
realm=tuttie
lt-cred-mech
fingerprint
# Relay only to LiveKit on this server, never anywhere else (no open relay).
denied-peer-ip=0.0.0.0-255.255.255.255
min-port=49160
max-port=49200
no-multicast-peers
no-cli
log-file=stdout
simple-log
verbose
